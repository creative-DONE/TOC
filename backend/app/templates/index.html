<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime AI - Vessel Planning</title>
  <meta name="description" content="TOC Textile Colouring Production Scheduler">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>window.lucide || document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"><\/script>')</script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script>window.React || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>')</script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>window.ReactDOM || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>')</script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>window.Babel || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"><\/script>')</script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-[#FFFFFF] text-slate-800 min-h-screen antialiased">
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FFFFFF; color: #0F172A; font-family: ui-sans-serif, system-ui, sans-serif;">
      <div style="width: 36px; height: 36px; border: 3px solid #2563EB; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;"></div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      <h2 style="font-size: 16px; font-weight: 600; margin: 0 0 4px 0; color: #0F172A;">Loading Prime AI - Vessel Planning...</h2>
      <p style="font-size: 12px; color: #64748B; margin: 0;">Loading vessel schedules, batch sequence and optimization matrix</p>
    </div>
  </div>

  <script>
    (function() {
      window.addEventListener('error', function(e) {
        console.error("Global Error Caught:", e);
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('Loading Prime AI') !== -1)) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#1e293b;padding:20px;font-family:sans-serif;text-align:center;">' +
            '<div style="background:#fef2f2;border:1px solid #ef4444;border-radius:8px;padding:20px;max-width:500px;text-align:left;">' +
            '<h3 style="margin:0 0 8px;color:#991b1b;font-size:15px;font-weight:bold;">Application Error Notice</h3>' +
            '<p style="margin:0 0 12px;color:#b91c1c;font-size:12px;">' + (e.message || "An error occurred while loading the application interface.") + '</p>' +
            '<button onclick="location.reload(true)" style="background:#2563eb;color:#fff;border:none;padding:6px 14px;border-radius:4px;font-size:12px;font-weight:bold;cursor:pointer;">Reload Page</button>' +
            '</div></div>';
        }
      });
    })();
  </script>

  <!-- Main Application Script with Cache Buster -->
  <script type="text/babel" src="/static/js/app.js?v=5.0.1"></script>
</body>
</html>
